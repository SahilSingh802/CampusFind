<form method="get" class="cf-card p-3 mb-4">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-lg-3"><label class="form-label small mb-1">Search</label>
      <input type="text" name="q" class="form-control" placeholder="Name or description" value="{{ form.q.value|default:'' }}"></div>
    <div class="col-6 col-lg-2"><label class="form-label small mb-1">Category</label>
      <select name="category" class="form-select">
        <option value="">All categories</option>
        {% for c in form.fields.category.queryset %}<option value="{{ c.pk }}" {% if form.category.value|stringformat:"s" == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select></div>
    <div class="col-6 col-lg-2"><label class="form-label small mb-1">Location</label>
      <input type="text" name="location" class="form-control" placeholder="e.g. Library" value="{{ form.location.value|default:'' }}"></div>
    <div class="col-6 col-lg-2"><label class="form-label small mb-1">Status</label>
      <select name="status" class="form-select">
        <option value="">Any status</option>
        <option value="ACTIVE" {% if form.status.value == 'ACTIVE' %}selected{% endif %}>Active</option>
        <option value="CLAIMED" {% if form.status.value == 'CLAIMED' %}selected{% endif %}>Claimed</option>
        <option value="RETURNED" {% if form.status.value == 'RETURNED' %}selected{% endif %}>Returned</option>
      </select></div>
    {% if show_type %}
    <div class="col-6 col-lg-1"><label class="form-label small mb-1">Type</label>
      <select name="type" class="form-select">
        <option value="">All</option>
        <option value="LOST" {% if selected_type == 'LOST' %}selected{% endif %}>Lost</option>
        <option value="FOUND" {% if selected_type == 'FOUND' %}selected{% endif %}>Found</option>
      </select></div>
    {% endif %}
    <div class="col-6 {% if show_type %}col-lg-2{% else %}col-lg-3{% endif %} d-flex gap-2">
      <button class="btn btn-primary flex-grow-1" type="submit"><i class="bi bi-funnel"></i> Filter</button>
      <a class="btn btn-soft" href="{{ request.path }}" title="Clear filters"><i class="bi bi-x-lg"></i></a>
    </div>
  </div>
</form>
