<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="text-muted fw-normal">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endfor %}
</div>
