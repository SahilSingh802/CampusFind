{% extends 'base.html' %}
{% block title %}Delete report{% endblock %}
{% block content %}
<div class="container auth-wrap">
  <div class="cf-card auth-card text-center">
    <i class="bi bi-trash3 fs-1 text-danger"></i>
    <h1 class="h4 mt-2">Delete “{{ item.title }}”?</h1>
    <p class="text-muted-ink">This removes the report and any claims on it. This cannot be undone.</p>
    <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete report</button>
      <a class="btn btn-soft" href="{{ item.get_absolute_url }}">Keep it</a>
    </form>
  </div>
</div>
{% endblock %}
